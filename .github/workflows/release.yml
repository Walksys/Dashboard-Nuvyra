name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Package Nuvyra Tarball & Zip
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist
          tar --exclude='./dist' --exclude='./.git' --exclude='./.github' -czf "dist/nuvyra-${VERSION}.tar.gz" .
          zip -r "dist/nuvyra-${VERSION}.zip" . -x "./dist/*" "./.git/*" "./.github/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nuvyra ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/nuvyra-${{ steps.get_version.outputs.VERSION }}.tar.gz
            dist/nuvyra-${{ steps.get_version.outputs.VERSION }}.zip
          generate_release_notes: true
          body: |
            ## 🎮 Nuvyra - Full Node.js Game & App Management Web Panel

            ### 🚀 Port Architecture
            - **Web UI & Console WebSocket**: Port `3001`
            - **Panel & Daemon REST API**: Port `3003`
            - **Embedded SFTP Server**: Port `3004`

            ### 📦 Supported Servers
            - **Minecraft**: Java 8-25 & Bedrock (Paper, Purpur, Fabric, Forge, NeoForge, Quilt, Velocity, etc.)
            - **Node.js**: v12 - v25 Apps & Bots
            - **Python**: v2.7, 3.7 - 3.13 Apps & Bots

            ### 🛠️ Quick Start
            ```bash
            # Interactive Menu
            ./menu.sh
            
            # Install & Build
            ./menu.sh install
            
            # Create Admin User
            ./menu.sh usercreate
            
            # Start with PM2
            ./menu.sh pm2
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
